[project]
name = "homeassistant-greenchoice"
version = "3.2.0"
description = "Integration to connect Greenchoice.nl with Home Assistant"
authors = ["Baris Demirdelen <barisdemirdelen@gmail.com>"]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "homeassistant>=2024.12.5",
    "aiohttp>=3.12.15",
    "beautifulsoup4>=4.12.3",
    "pydantic>=2.12.2",
    "voluptuous>=0.15.2",
]

[dependency-groups]
dev = [
    "coverage>=7.10.6",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-homeassistant-custom-component>=0.13.306",
    "aioresponses>=0.7.8",
    "ruff>=0.9.4",
    "ty>=0.0.0a8",
]
